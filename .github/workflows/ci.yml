name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - path: server-gateway
            name: server-gateway
          - path: services/user
            name: user-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go work sync

      - name: go fmt
        run: |
          cd ${{ matrix.module.path }}
          if [ "$(gofmt -s -l . | grep -v 'pkg/protos' | wc -l)" -gt 0 ]; then
            echo "Code is not formatted properly. Run 'go fmt ./...'"
            gofmt -s -l . | grep -v 'pkg/protos'
            exit 1
          fi

      - name: go vet
        run: go vet ./${{ matrix.module.path }}/...

  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - path: server-gateway
            name: server-gateway
          - path: services/user
            name: user-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go work sync

      - name: Run tests
        run: go test -v -race -coverprofile=${{ matrix.module.path }}/coverage.out ./${{ matrix.module.path }}/...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ${{ matrix.module.path }}/coverage.out
          flags: ${{ matrix.module.name }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module:
          - path: server-gateway
            name: server-gateway
          - path: services/user
            name: user-service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true

      - name: Install dependencies
        run: go work sync

      - name: Build
        run: go build -v ./${{ matrix.module.path }}/...
