apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ./services/user/docker-compose.yml -o ./deployment/user
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: user-service
  name: user-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: user-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ./services/user/docker-compose.yml -o ./deployment/user
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: user-service
    spec:
      containers:
        - env:
            - name: GRPC_PORT
              value: "50051"
            - name: JWT_SECRET
              value: your-super-secret-key-minimum-32-chars
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              value: postgres
          image: user-service
          name: user-service
          ports:
            - containerPort: 50051
              protocol: TCP
      restartPolicy: Always
