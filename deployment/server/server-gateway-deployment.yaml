apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f ./server-gateway/docker-compose.yml -o ./deployment/server
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: server-gateway
  name: server-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: server-gateway
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f ./server-gateway/docker-compose.yml -o ./deployment/server
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: server-gateway
    spec:
      containers:
        - env:
            - name: CHAT_SRV_ADDR
              value: host.docker.internal:50053
            - name: HTTP_PORT
              value: "8080"
            - name: JWT_SECRET
              value: change-me-secret
            - name: MESSAGE_SRV_ADDR
              value: host.docker.internal:50052
            - name: USER_SRV_ADDR
              value: host.docker.internal:50051
          image: server-gateway
          name: server-gateway
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
