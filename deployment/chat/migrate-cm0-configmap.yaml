apiVersion: v1
data:
  000001_create_chat_tables.down.sql: |
    DROP TABLE IF EXISTS invite_links;
    DROP TABLE IF EXISTS chat_members;
    DROP TABLE IF EXISTS chats;
  000001_create_chat_tables.up.sql: |
    CREATE TABLE chats (
        id BIGSERIAL PRIMARY KEY,
        name VARCHAR(255) NOT NULL,
        type INTEGER NOT NULL DEFAULT 2,          -- 1 private / 2 group / 3 channel
        created_by BIGINT NOT NULL DEFAULT 0,
        avatar_url TEXT,
        is_active BOOLEAN DEFAULT true,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );

    CREATE TABLE chat_members (
        chat_id BIGINT NOT NULL REFERENCES chats(id) ON DELETE CASCADE,
        user_id BIGINT NOT NULL,
        role INTEGER NOT NULL DEFAULT 1,          -- 1 member / 2 moderator / 3 admin / 4 owner
        joined_at TIMESTAMP DEFAULT NOW(),
        last_read_at TIMESTAMP,
        unread_count BIGINT DEFAULT 0,
        PRIMARY KEY (chat_id, user_id)
    );

    CREATE TABLE invite_links (
        id BIGSERIAL PRIMARY KEY,
        chat_id BIGINT NOT NULL REFERENCES chats(id) ON DELETE CASCADE,
        code VARCHAR(50) UNIQUE NOT NULL,
        max_uses INTEGER DEFAULT 0,
        used_count INTEGER DEFAULT 0,
        expires_at TIMESTAMP,
        is_active BOOLEAN DEFAULT true,
        created_by BIGINT NOT NULL DEFAULT 0,
        created_at TIMESTAMP DEFAULT NOW()
    );

    CREATE INDEX idx_chat_members_user ON chat_members(user_id);
    CREATE INDEX idx_chat_members_role ON chat_members(role);
    CREATE INDEX idx_invite_links_code ON invite_links(code) WHERE is_active = true;
    CREATE INDEX idx_chats_name ON chats USING GIN (to_tsvector('russian', name));
  000002_create_chat_settings.down.sql: |
    DROP TABLE IF EXISTS chat_settings;
  000002_create_chat_settings.up.sql: |
    CREATE TABLE chat_settings (
        chat_id BIGINT PRIMARY KEY REFERENCES chats(id) ON DELETE CASCADE,
        is_private BOOLEAN DEFAULT false,
        allow_messages_from_all BOOLEAN DEFAULT true,
        allow_media BOOLEAN DEFAULT true,
        allow_reactions BOOLEAN DEFAULT true,
        message_ttl_seconds INTEGER DEFAULT 0,
        language VARCHAR(10) DEFAULT 'ru',
        is_announcement BOOLEAN DEFAULT false
    );
kind: ConfigMap
metadata:
  labels:
    io.kompose.service: migrate
  name: migrate-cm0
